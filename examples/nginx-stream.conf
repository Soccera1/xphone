# Include inside the top-level stream {} block in /etc/nginx/nginx.conf.
# Requires ngx_stream_module (built with --with-stream or loaded dynamically).
# These listeners require exclusive use of TCP/UDP 443 on the selected addresses.
# To use a dedicated public IP, replace 0.0.0.0 and :: in both server blocks.
# Keep xphoned's certificate valid for the PUBLIC hostname used by clients.
# Keep TLS wrapping (proxy_ssl) disabled; do not add ssl/quic to these listeners.

# HTTPS / HTTP/2: pass TLS through unchanged to xphoned.
server {
    listen 0.0.0.0:443;
    listen [::]:443 ipv6only=on;

    proxy_pass 127.0.0.1:8443;
    proxy_connect_timeout 5s;
    proxy_timeout 75s;
    proxy_protocol off;
}

# HTTPS / HTTP/3: pass QUIC datagrams through on the SAME public port.
server {
    listen 0.0.0.0:443 udp reuseport;
    listen [::]:443 udp reuseport ipv6only=on;

    proxy_pass 127.0.0.1:8443;
    proxy_timeout 75s;
    proxy_requests 0;
    proxy_protocol off;
    # Leave proxy_responses at its unlimited default: QUIC is a persistent,
    # bidirectional session, not a one-request/one-response UDP exchange.
}
